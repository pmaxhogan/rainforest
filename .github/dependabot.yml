# stack-template: dependabot/npm@1 eb5e18f484c9
version: 2

# Canonical Dependabot policy (stack standard deps.dependabot-policy):
#   - weekly, Monday 06:00 in the owner's timezone: one batch a week, not a daily flood
#   - one `minor-and-patch` PR per ecosystem; majors stay separate PRs so they get reviewed
#   - a `security` group so vulnerability fixes land together, any semver type
#   - cooldown: majors wait 14 days, minors and patches 5. This project departs from the
#     standard's 14/3/0 on purpose: a merged update becomes a signed daemon release that
#     installs itself, so every version update waits a few days for a bad release to be
#     noticed and pulled upstream first. Security updates are not delayed.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      # No update-types here on purpose: a security fix is merged on green regardless
      # of semver type (D-DEP-6).
      security:
        applies-to: security-updates
        patterns:
          - "*"
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 5
      semver-patch-days: 5
    commit-message:
      prefix: "deps"
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - "*"
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 5
      semver-patch-days: 5
    commit-message:
      prefix: "deps(actions)"
