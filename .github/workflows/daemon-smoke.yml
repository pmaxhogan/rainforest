name: daemon-smoke

# Package the daemon, extract the tarball with the system tar and run the bundle on every OS
# we ship to. Manual and weekly only: macOS and Windows minutes are expensive while the repo
# is private. The release workflow itself only runs on Linux.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 10 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Package
        run: node scripts/package-daemon.mjs --out dist/release

      # Relative paths only: on Windows, a drive letter in a tar argument is read as a host.
      - name: Extract and run
        run: |
          version=$(node -e "console.log(JSON.parse(require('fs').readFileSync('dist/release/manifest.json', 'utf8')).version)")
          rm -rf dist/smoke dist/smoke-home
          mkdir -p dist/smoke dist/smoke-home
          tar -xzf "dist/release/rainforestd-${version}.tgz" -C dist/smoke
          cd "dist/smoke/rainforestd-${version}"
          export RAINFOREST_HOME="${GITHUB_WORKSPACE}/dist/smoke-home"
          printed=$(node rainforestd.mjs version | tr -d '\r')
          echo "printed version: ${printed}"
          test "${printed}" = "${version}"
          node rainforestd.mjs selftest
